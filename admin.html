<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Немеция — Админка</title>
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <img src="logo.png" alt="" class="logo-img" onload="this.classList.add('ok')" onerror="this.style.display='none'">
            <span class="logo-badge">N</span>
            НЕМЕЦИЯ
            <span class="logo-sub">админка</span>
        </div>
        <div class="header-spacer"></div>
        <label class="theme-toggle" title="Переключить тему">
            <span>🌙</span>
            <input type="checkbox" id="themeToggle">
            <span class="slider"></span>
            <span>☀️</span>
        </label>
        <a href="index.html" class="header-btn">🧮 Калькулятор</a>
    </header>

    <div class="admin-wrap">
        <div class="admin-card">
            <h2><span class="sec-icon">💵</span> Ставки нормо-часа</h2>
            <div class="admin-row">
                <div class="admin-field">
                    <label>ДВС / КПП (₽)</label>
                    <input type="number" id="rateEngine" class="admin-input" placeholder="3000">
                </div>
                <div class="admin-field">
                    <label>Остальные работы (₽)</label>
                    <input type="number" id="rateStandard" class="admin-input" placeholder="2500">
                </div>
                <div class="admin-field" style="flex:0 0 auto;display:flex;align-items:flex-end;">
                    <button id="saveRatesBtn" class="admin-btn primary">💾 Сохранить ставки</button>
                </div>
            </div>
        </div>

        <div class="admin-card">
            <h2><span class="sec-icon">📐</span> Коэффициенты</h2>
            <div class="admin-row">
                <div class="admin-field">
                    <label>Прикипевшие / ржавые болты (%)</label>
                    <input type="number" id="coeffRusty" class="admin-input" placeholder="15">
                </div>
                <div class="admin-field">
                    <label>Алюминиевые детали (%)</label>
                    <input type="number" id="coeffAluminum" class="admin-input" placeholder="20">
                </div>
                <div class="admin-field">
                    <label>Установлено ГБО (%)</label>
                    <input type="number" id="coeffLpg" class="admin-input" placeholder="10">
                </div>
                <div class="admin-field" style="flex:0 0 auto;display:flex;align-items:flex-end;">
                    <button id="saveCoeffsBtn" class="admin-btn primary">💾 Сохранить %</button>
                </div>
            </div>
            <div class="admin-row" style="margin-top:14px;">
                <div class="admin-field">
                    <label>Существующие коэффициенты</label>
                    <div id="coeffList"></div>
                </div>
            </div>
            <div class="admin-row" style="margin-top:12px;">
                <div class="admin-field">
                    <label>Название нового коэффициента</label>
                    <input type="text" id="coeffNewLabel" class="admin-input" placeholder="Например: Срочный заказ">
                </div>
                <div class="admin-field" style="max-width:120px;">
                    <label>Процент</label>
                    <input type="number" id="coeffNewPercent" class="admin-input" placeholder="10">
                </div>
                <div class="admin-field" style="flex:0 0 auto;display:flex;align-items:flex-end;">
                    <button id="addCoeffBtn" class="admin-btn primary">➕ Добавить коэффициент</button>
                </div>
            </div>
        </div>

        <div class="admin-card">
            <h2><span class="sec-icon">👥</span> Менеджеры</h2>
            <table class="admin-table"><tbody id="managersTable"></tbody></table>
            <div class="admin-row" style="margin-top:10px;">
                <div class="admin-field">
                    <label>Новый менеджер</label>
                    <input type="text" id="newManagerName" class="admin-input" placeholder="Например: Алексей">
                </div>
                <div class="admin-field" style="flex:0 0 auto;display:flex;align-items:flex-end;">
                    <button id="addManagerBtn" class="admin-btn primary">➕ Добавить</button>
                </div>
            </div>
        </div>

        <div class="admin-card">
            <h2><span class="sec-icon">📨</span> Очередь заявок на добавление</h2>
            <div id="vinQueueList"></div>
            <div class="admin-row" style="margin-top:10px;">
                <button id="exportVinBtn" class="admin-btn">⬇️ Экспорт очереди (JSON)</button>
            </div>
        </div>

        <div class="admin-card">
            <h2><span class="sec-icon">🚗</span> Добавить модификацию в базу</h2>
            <div class="admin-row">
                <div class="admin-field">
                    <label>Марка</label>
                    <select id="modBrand" class="rate-select"></select>
                </div>
                <div class="admin-field">
                    <label>Модель</label>
                    <input type="text" id="modModel" class="admin-input" placeholder="Например: Golf">
                </div>
                <div class="admin-field">
                    <label>Поколение</label>
                    <input type="text" id="modGen" class="admin-input" placeholder="Например: VII (2012–2020)">
                </div>
            </div>
            <div class="admin-row" style="margin-top:10px;">
                <div class="admin-field">
                    <label>Код двигателя</label>
                    <input type="text" id="modEngineCode" class="admin-input" placeholder="Например: CZDA">
                </div>
                <div class="admin-field">
                    <label>Объём</label>
                    <input type="text" id="modEngineVol" class="admin-input" placeholder="Например: 1.4 L">
                </div>
                <div class="admin-field">
                    <label>Мощность</label>
                    <input type="text" id="modEnginePower" class="admin-input" placeholder="Например: 122 л.с.">
                </div>
                <div class="admin-field">
                    <label>Момент</label>
                    <input type="text" id="modEngineTorque" class="admin-input" placeholder="Например: 200 Нм">
                </div>
            </div>
            <div class="admin-row" style="margin-top:10px;">
                <div class="admin-field">
                    <label>Код КПП</label>
                    <input type="text" id="modGbCode" class="admin-input" placeholder="Например: DQ250">
                </div>
                <div class="admin-field">
                    <label>Тип КПП</label>
                    <input type="text" id="modGbType" class="admin-input" placeholder="Например: DSG (робот)">
                </div>
                <div class="admin-field">
                    <label>Передач</label>
                    <input type="number" id="modGbGears" class="admin-input" placeholder="Например: 6">
                </div>
                <div class="admin-field">
                    <label>Привод</label>
                    <select id="modDrive" class="rate-select">
                        <option value="Передний">Передний</option>
                        <option value="Полный (4Motion)">Полный (4Motion)</option>
                        <option value="Задний">Задний</option>
                    </select>
                </div>
            </div>

            <h2 style="margin-top:18px;"><span class="sec-icon">🧪</span> Жидкости (необязательно)</h2>
            <div class="admin-row">
                <div class="admin-field"><label>Масло ДВС: объём</label><input type="text" id="flOilVol" class="admin-input" placeholder="4.0 л"></div>
                <div class="admin-field"><label>Масло ДВС: допуск</label><input type="text" id="flOilSpec" class="admin-input" placeholder="VW 502.00 / 504.00"></div>
                <div class="admin-field"><label>Масло ДВС: вязкость</label><input type="text" id="flOilVisc" class="admin-input" placeholder="5W-30"></div>
            </div>
            <div class="admin-row" style="margin-top:8px;">
                <div class="admin-field"><label>Масло КПП: объём</label><input type="text" id="flGbVol" class="admin-input" placeholder="1.7 л"></div>
                <div class="admin-field"><label>Масло КПП: допуск</label><input type="text" id="flGbSpec" class="admin-input" placeholder="VW G 052 182"></div>
                <div class="admin-field"><label>Раздатка: объём</label><input type="text" id="flTfVol" class="admin-input" placeholder="0.9 л (если есть)"></div>
                <div class="admin-field"><label>Раздатка: допуск</label><input type="text" id="flTfSpec" class="admin-input" placeholder="VW G 055 145"></div>
            </div>
            <div class="admin-row" style="margin-top:8px;">
                <div class="admin-field"><label>Передний редуктор: объём</label><input type="text" id="flDfVol" class="admin-input" placeholder="0.8 л (если есть)"></div>
                <div class="admin-field"><label>Задний редуктор: объём</label><input type="text" id="flDrVol" class="admin-input" placeholder="0.8 л (если есть)"></div>
                <div class="admin-field"><label>Антифриз: объём</label><input type="text" id="flCoolVol" class="admin-input" placeholder="7.0 л"></div>
                <div class="admin-field"><label>Антифриз: допуск</label><input type="text" id="flCoolSpec" class="admin-input" placeholder="G12evo"></div>
            </div>
            <div class="admin-row" style="margin-top:8px;">
                <div class="admin-field"><label>Тормозная жидкость: допуск</label><input type="text" id="flBrSpec" class="admin-input" placeholder="DOT 4"></div>
                <div class="admin-field"><label>ГУР: объём (или «ЭУР»)</label><input type="text" id="flPsVol" class="admin-input" placeholder="ЭУР — не обслуживается"></div>
                <div class="admin-field"><label>Хладагент: объём</label><input type="text" id="flAcVol" class="admin-input" placeholder="525 г"></div>
                <div class="admin-field"><label>Хладагент: тип</label><input type="text" id="flAcSpec" class="admin-input" placeholder="R134a"></div>
            </div>

            <h2 style="margin-top:18px;"><span class="sec-icon">🛠️</span> Работы и нормо-часы</h2>
            <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Впиши нормо-часы напротив работы — она попадёт в модификацию. Пустые поля игнорируются.</p>
            <div id="modWorksList"></div>
            <div class="admin-row" style="margin-top:14px;">
                <button id="saveModBtn" class="admin-btn primary">💾 Скачать обновлённый файл базы</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="volkswagen.js"></script>
    <script src="admin.js"></script>
</body>
</html>
